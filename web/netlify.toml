[build]
  command = "npm run build"
  publish = "dist"

# Do not bake VITE_SERVER_API_URL here. The PWA must call same-origin /api
# so Netlify can proxy to the Supabase Edge Function and the browser never hits CORS.

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/api/*"
  to = "https://vdohxjqzczhmgfuedrwj.supabase.co/functions/v1/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
