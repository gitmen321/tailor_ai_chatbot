[build]
  command = "npm run build"
  publish = "dist"

# Do not bake VITE_SERVER_API_URL here. The PWA must call same-origin /api
# so Netlify can proxy to the Supabase Edge Function and the browser never hits CORS.

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=(self)"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob: https:; font-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; connect-src 'self' https://*.supabase.co https://generativelanguage.googleapis.com; media-src 'self' blob: data:"

[[redirects]]
  from = "/api/*"
  to = "https://vdohxjqzczhmgfuedrwj.supabase.co/functions/v1/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
