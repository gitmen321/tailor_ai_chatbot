name: Deploy check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run verify

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run check:api
      - run: npm run lint
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://ci-project.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-publishable-key

  edge-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check supabase/functions/_shared/agent.ts supabase/functions/_shared/application supabase/functions/_shared/auth.ts supabase/functions/_shared/cors.ts supabase/functions/_shared/db.ts supabase/functions/_shared/embedText768.ts supabase/functions/_shared/errors.ts supabase/functions/_shared/gemini.ts supabase/functions/_shared/logger.ts supabase/functions/_shared/rateLimit.ts supabase/functions/_shared/router.ts supabase/functions/_shared/router_test.ts supabase/functions/_shared/saveLearnedAnswer.ts supabase/functions/_shared/searchWeb.ts supabase/functions/_shared/searchYoutube.ts supabase/functions/_shared/serverKey.ts supabase/functions/_shared/speak.ts supabase/functions/_shared/transcribe.ts
      - run: deno lint supabase/functions
      - run: deno check supabase/functions/api/index.ts supabase/functions/_shared/router_test.ts
      - run: deno test --allow-env --allow-net --allow-read supabase/functions/_shared

  whatsapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: whatsapp/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
